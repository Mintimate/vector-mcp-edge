<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" /> <!-- 橙色 -->
      <stop offset="100%" style="stop-color:#00BFFF;stop-opacity:1" /> <!-- 蓝色 -->
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.8" /> <!-- 蓝色 -->
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.8" /> <!-- 橙色 -->
    </linearGradient>
    <linearGradient id="grad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:0.6" /> <!-- 橙色 -->
      <stop offset="100%" style="stop-color:#00BFFF;stop-opacity:0.6" /> <!-- 蓝色 -->
    </linearGradient>
  </defs>

  <!-- 外圈 - 代表边缘网络 -->
  <circle cx="128" cy="128" r="120" stroke="url(#grad1)" stroke-width="4" fill="none" stroke-dasharray="12 6" opacity="0.5"/>

  <!-- 六边形底座 - 代表节点/边缘函数 -->
  <polygon points="128,28 210,73 210,163 128,208 46,163 46,73" 
           fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.3"/>

  <!-- 中心搜索/向量图标 -->
  <!-- 放大镜圆 -->
  <circle cx="118" cy="112" r="48" stroke="url(#grad1)" stroke-width="6" fill="none"/>
  <!-- 放大镜手柄 -->
  <line x1="152" y1="146" x2="185" y2="179" stroke="url(#grad1)" stroke-width="6" stroke-linecap="round"/>

  <!-- 向量箭头 - 在放大镜内部，代表向量/方向 -->
  <g transform="translate(118, 112)">
    <!-- 三条向量线，代表多维向量空间 -->
    <line x1="-20" y1="10" x2="20" y2="-10" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-18" y1="-5" x2="22" y2="5" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="20" x2="10" y2="-20" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 向量端点 -->
    <circle cx="20" cy="-10" r="3" fill="#FF8C00"/>
    <circle cx="22" cy="5" r="3" fill="#00BFFF"/>
    <circle cx="10" cy="-20" r="3" fill="#FF8C00"/>
  </g>

  <!-- 边缘节点小圆点 - 分布在六边形顶点 -->
  <circle cx="128" cy="28" r="6" fill="url(#grad1)"/>
  <circle cx="210" cy="73" r="6" fill="url(#grad1)"/>
  <circle cx="210" cy="163" r="6" fill="url(#grad1)"/>
  <circle cx="128" cy="208" r="6" fill="url(#grad1)"/>
  <circle cx="46" cy="163" r="6" fill="url(#grad1)"/>
  <circle cx="46" cy="73" r="6" fill="url(#grad1)"/>

  <!-- 连接线 - 从中心到边缘节点，代表边缘分发 -->
  <line x1="128" y1="112" x2="128" y2="34" stroke="url(#grad3)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="128" y1="112" x2="204" y2="76" stroke="url(#grad3)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="128" y1="112" x2="204" y2="160" stroke="url(#grad3)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="128" y1="112" x2="128" y2="202" stroke="url(#grad3)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="128" y1="112" x2="52" y2="160" stroke="url(#grad3)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="128" y1="112" x2="52" y2="76" stroke="url(#grad3)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- AI 光芒效果 -->
  <circle cx="118" cy="112" r="55" stroke="url(#grad1)" stroke-width="1" fill="none" opacity="0.2">
    <animate attributeName="r" values="55;62;55" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.1;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>

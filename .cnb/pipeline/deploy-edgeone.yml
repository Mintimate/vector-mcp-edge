# 构建并部署到 EdgeOne Makers
main:
  push:
    - name: "构建产物"
      imports:
        - https://cnb.cool/Mintimate/secret/-/blob/main/vector-mcp-edge.yaml
      docker:
        image: node:22
        volumes:
          - /root/.npm:copy-on-write
      stages:
        - name: "安装依赖"
          script: npm ci
        - name: "部署流程"
          image: docker.cnb.cool/flyinbug/dev-ops/nodejs:latest
          script:
            - PAGES_SOURCE=skills npx --no-install edgeone makers deploy -n vector-mcp-edge -t $EO_SECRET
